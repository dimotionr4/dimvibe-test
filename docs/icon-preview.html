<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Предпросмотр иконок</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--line:#e3e3e6;--acc:#029C91}
:root[data-theme=dark]{--bg:#141416;--fg:#f2f2f4;--mut:#9a9aa1;--line:#2e2e33}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:28px 0 8px}
p{color:var(--mut);margin:0 0 12px}
button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--fg);cursor:pointer}
.wrap{overflow-x:auto}
table{border-collapse:collapse;min-width:640px;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
th{color:var(--mut);font-weight:500;font-size:13px}
td:first-child,th:first-child{text-align:left}
.ic{display:inline-block;width:28px;height:28px;background:currentColor;-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat}
svg.old{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sz{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
small{display:block;color:var(--mut);font-size:11px}
</style>
</head>
<body>
<h1>Какие иконки выбрать</h1>
<p>Сравнение: текущие нарисованные значки и три готовых набора. <button id="th">Светлая / тёмная</button></p>
<h2>Модули</h2>
<div class="wrap"><table id="mods"></table></div>
<h2>Кнопки редактора</h2>
<div class="wrap"><table id="ui"></table></div>
<h2>Как выглядит мелко (20 и 16 пикс.)</h2>
<div class="sz" id="small"></div>

const ic=(k,n,s)=>`<span class="ic" style="--u:url('${V[k](n)}');${s?`width:${s}px;height:${s}px`:''}"></span>`;
function table(el,rows,first,old){
 let h=`<tr><th>${first}</th>${old?'<th>Сейчас</th>':''}${SETS.map(s=>`<th>${s[0]}</th>`).join('')}</tr>`;
 for(const [label,names,oldSvg] of rows)
  h+=`<tr><td>${label}</td>${old?`<td><svg class="old" viewBox="0 0 24 24">${oldSvg||''}</svg></td>`:''}${SETS.map((s,i)=>`<td>${ic(s[1],names[i])}<small>${names[i]}</small></td>`).join('')}</tr>`;
 el.innerHTML=h;
}
table(document.getElementById('mods'),Object.keys(MAP).map(k=>[MODS[k].name,MAP[k],MODS[k].icon]),'Модуль',true);
table(document.getElementById('ui'),Object.entries(UI).map(([k,v])=>[k,v]),'Кнопка',false);
document.getElementById('small').innerHTML=SETS.map(s=>`<div><b>${s[0]}</b><br>`+['multiple_choice','matching','timeline','hotspot','flashcards'].map(m=>ic(s[1],MAP[m][SETS.indexOf(s)],20)+' '+ic(s[1],MAP[m][SETS.indexOf(s)],16)).join(' ')+'</div>').join('');
document.getElementById('th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};
