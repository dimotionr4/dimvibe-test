<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar: выбор значков</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--line:#e3e3e6;--acc:#029C91}
:root[data-theme=dark]{--bg:#141416;--fg:#f2f2f4;--mut:#9a9aa1;--line:#2e2e33}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:26px 0 8px}p{color:var(--mut);margin:0 0 12px}
button,label.st{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--fg);cursor:pointer;display:inline-block;margin:0 4px 4px 0}
label.st.on{border-color:var(--acc);color:var(--acc)}label.st input{display:none}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.nm{width:180px;flex:none;display:flex;align-items:center}
.old{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:8px;flex:none}
.c{width:96px;text-align:center;padding:8px 4px;border:2px solid transparent;border-radius:10px;cursor:pointer}
.c.sel{border-color:var(--acc)}.c small{display:block;color:var(--mut);font-size:10.5px;word-break:break-all}
.ic{display:inline-block;width:30px;height:30px;background:currentColor;-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat}
textarea{width:100%;height:160px;font:12px monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;box-sizing:border-box}
</style>
</head>
<body>
<h1>Solar: выберите значок для каждого места</h1>
<p>Нажмите на значок, чтобы выбрать (появится рамка). Стиль линии переключается кнопками. Внизу собирается список выбора, его можно скопировать и прислать. Слева у модуля показан нынешний значок.</p>
<div id="sts"></div><button id="th">Светлая / тёмная</button>
<h2>Модули</h2><div id="mods"></div>
<h2>Кнопки</h2><div id="ui"></div>
<h2>Ваш выбор</h2><textarea id="out" readonly></textarea>

const STY=[['linear','Линия'],['bold','Жирный'],['broken','Прерывистый']];
let st='linear';const pick={};
const url=n=>{const s=ICONS[n+'-'+st];return s?'data:image/svg+xml,'+encodeURIComponent(s).replace(/'/g,'%27'):''};
function cell(g,n){return '<div class="c'+(pick[g]===n?' sel':'')+'" data-g="'+g+'" data-n="'+n+'"><span class="ic" style="--u:url(\''+url(n)+'\')"></span><small>'+n+(ICONS[n+'-'+st]?'':' (нет в этом стиле)')+'</small></div>'}
function draw(){
 document.getElementById('sts').innerHTML=STY.map(s=>'<label class="st'+(s[0]===st?' on':'')+'"><input type="radio" name="s" value="'+s[0]+'">'+s[1]+'</label>').join('');
 document.getElementById('mods').innerHTML=Object.keys(M).map(k=>'<div class="row"><div class="nm"><svg class="old" viewBox="0 0 24 24">'+MODS[k].icon+'</svg>'+MODS[k].name+'</div>'+M[k].map(n=>cell(k,n)).join('')+'</div>').join('');
 document.getElementById('ui').innerHTML=Object.keys(U).map(k=>'<div class="row"><div class="nm">'+k+'</div>'+U[k].map(n=>cell('ui:'+k,n)).join('')+'</div>').join('');
 document.getElementById('out').value='Стиль: '+st+'\n'+Object.entries(pick).map(([g,n])=>g.replace('ui:','кнопка ')+' → '+n).join('\n');
}
document.addEventListener('click',e=>{const c=e.target.closest('.c');if(c){pick[c.dataset.g]=c.dataset.n;draw()}});
document.addEventListener('change',e=>{if(e.target.name==='s'){st=e.target.value;draw()}});
document.getElementById('th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};
draw();
