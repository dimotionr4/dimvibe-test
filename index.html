<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
// Адрес сайта без ?id= (и не предпросмотр редактора) открывает главную; упражнения ученика всегда с ?id=
if (!/[?&](id|preview)=?/.test(location.search)) location.replace('home.html');
</script>
<title>DimVibe — тест Fill Blanks</title>
<link rel="stylesheet" href="core/gap.css?v=6">
<link rel="stylesheet" href="core/check.css?v=1">
<link rel="stylesheet" href="core/comic.css?v=12">
<link rel="stylesheet" href="modules/image-to-gaps/player.css?v=3">
<link rel="stylesheet" href="modules/true-false/player.css?v=2">
<link rel="stylesheet" href="modules/multiple-choice/player.css?v=3">
<link rel="stylesheet" href="modules/matching/player.css?v=4">
<style>
  /* Тема: у ученика следует за устройством; в предпросмотре редактор может задать data-theme="light" или "dark" */
  /* Акцент упражнения: --accent-l и --accent-d выставляет applyAccent (core/design.js); на акценте в тёмной теме тёмный текст */
  :root { color-scheme:light; --bg:#f7f7fb; --card:#fff; --text:#1d1d2b; --muted:#6b6b80; --accent:var(--accent-l, #6d4aff); --on-accent:#fff; --ok:#1f9d55; --bad:#d64545; --line:#c9c9d8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme:dark; --bg:#16161f; --card:#20202c; --text:#f2f2f8; --muted:#a3a3b5; --accent:var(--accent-d, #9d86ff); --on-accent:#16161f; --ok:#4ccf82; --bad:#ff7070; --line:#41415a; }
  }
  :root[data-theme="dark"] { color-scheme:dark; --bg:#16161f; --card:#20202c; --text:#f2f2f8; --muted:#a3a3b5; --accent:var(--accent-d, #9d86ff); --on-accent:#16161f; --ok:#4ccf82; --bad:#ff7070; --line:#41415a; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  /* Три части: шапка и низ на месте, прокручивается только середина */
  body { margin:0; display:flex; flex-direction:column; height:100vh; height:100dvh; background:var(--bg); color:var(--text); font-family: system-ui, "Noto Sans", "Noto Sans Georgian", "Segoe UI", sans-serif; line-height:1.5; }
  header { flex:none; padding:10px 12px 8px; border-bottom:1px solid var(--line); }
  main { flex:1 1 auto; min-height:0; overflow-y:auto; padding:10px var(--pad); -webkit-overflow-scrolling:touch; }
  /* Макет (вкладка «Дизайн»): ширина колонки, плотность отступов, фон. Классы на <html> ставит applyLook; без них — прежний вид */
  :root { --content-w:800px; --pad:12px; --card-pad:10px 12px; --card-gap:10px; --card-lh:3.5; }
  .width-compact { --content-w:560px; }
  .width-wide { --content-w:100%; }
  .dens-compact { --card-pad:8px 10px; --card-gap:6px; --card-lh:3.1; --pad:8px; }
  .dens-loose { --card-pad:14px 16px; --card-gap:16px; --card-lh:3.9; --pad:16px; }
  #root, header > *, footer > * { max-width:var(--content-w); margin-left:auto; margin-right:auto; }
  .bg-backdrop main { background:color-mix(in srgb, var(--accent) 9%, var(--bg)); }
  /* «Карточка»: всё упражнение в одной рамке (класс panel ставится на #root) */
  #root.panel { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:var(--card-gap); box-shadow:0 2px 10px rgba(0,0,0,.08); }
  footer { flex:none; padding:8px 12px 10px; border-top:1px solid var(--line); background:var(--bg); }
  .head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  h1 { flex:1; min-width:0; font-size:1.05rem; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .reset { flex:none; display:flex; align-items:center; gap:6px; }
  .reset button { min-height:34px; padding:2px 10px; }
  .reset .ask { color:var(--muted); font-size:.9rem; }
  .reset [hidden] { display:none; }
  .para + .para { margin-top:.8em; }
  /* Кнопки режимов нужны только в предпросмотре у преподавателя; режим ученика выбирает преподаватель */
  .modes { display:none; gap:6px; overflow-x:auto; }
  .preview .modes { display:flex; }
  .modes button { flex:none; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:6px 12px; min-height:40px; cursor:pointer; }
  .modes button { font-size:.9rem; min-height:36px; padding:4px 10px; }
  button.active { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  button.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:var(--card-pad); margin-bottom:var(--card-gap); line-height:var(--card-lh); } /* запас по высоте под значки в углах пропусков */
  /* Вид пропуска (форма, ширина, состояния) — в core/gap.css */
  /* Результат не только цветом: у верного ✓, у неверного ✗ */
  /* Инструкция: сверху, по умолчанию развёрнута, ученик может свернуть */
  .instr { border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:12px; background:var(--card); margin-bottom:10px; }
  .instr-head { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; border:none; background:transparent; text-align:left; font-weight:600; padding:8px 12px; min-height:44px; }
  .instr-head::after { content:"▾"; color:var(--muted); }
  .instr-head[aria-expanded="false"]::after { content:"▸"; }
  .instr-body { padding:0 12px 10px; display:flow-root; } /* flow-root: блок охватывает обтекаемую картинку */
  .instr-body[hidden] { display:none; } /* без этой строки flow-root не даёт свернуть инструкцию */
  .instr-body p { margin:.4em 0; }
  /* Подсказка: замок до второй проверки, потом лампочка; окно не выходит за края экрана */
  /* Значок подсказки — в core/gap.css (в углу пропуска): замок до второй проверки, потом лампочка */
  .pop { position:fixed; z-index:20; width:max-content; max-width:min(280px, calc(100vw - 16px)); background:var(--card); color:var(--text); border:1px solid var(--accent); border-radius:10px; padding:8px 12px; line-height:1.4; box-shadow:0 4px 16px rgba(0,0,0,.3); overflow-wrap:anywhere; }
  /* width:0 + min-width:100%: собственная ширина поля не растягивает пропуск, его размер задаёт форма/ширина из дизайна */
  .gap.w-auto select { width:auto; padding:0 8px; } /* «Авто» в списке: по самому длинному варианту, чтобы слова не обрезались */
  .gap input, .gap select { font:inherit; width:0; min-width:100%; min-height:38px; border:none; background:transparent; color:inherit; text-align:center; }
  .gap select option { background:var(--card); color:var(--text); }
  /* Банк занимает не больше четверти экрана и прокручивается сам */
  .bank { display:flex; flex-wrap:wrap; gap:6px; max-height:25vh; overflow-y:auto; margin-bottom:8px; }
  .bank:empty { display:none; }
  .chip { display:inline-flex; align-items:center; min-height:36px; padding:2px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); cursor:pointer; user-select:none; }
  .chip.used { opacity:.35; cursor:default; }
  .chip.selected { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  /* Нижняя панель: кнопка «Проверить» и блок результата — в core/check.css */
  .unavailable { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; color:var(--muted); font-size:1.1rem; }
</style>
</head>
<body>
<header>
  <div class="head">
    <h1 id="title">Загрузка…</h1>
    <div class="reset">
      <button id="resetTop" title="Начать заново" aria-label="Начать заново">↻</button>
      <span id="resetAsk" hidden><span class="ask">Начать заново?</span> <button id="resetYes">Да</button> <button id="resetNo">Нет</button></span>
    </div>
  </div>
  <div class="modes">
    <button data-mode="word_bank">Банк слов</button>
    <button data-mode="dropdown">Выпадающий список</button>
    <button data-mode="typing">Ввод вручную</button>
  </div>
</header>
<main id="main">
  <div id="root"></div>
</main>
<footer>
  <div class="bank" id="bank"></div>
  <div class="actions">
    <div class="score" id="score" role="status" aria-live="polite">
      <span id="scoreText"></span>
      <span class="bar" id="scoreBar" hidden><i></i></span>
    </div>
    <button class="primary check-btn" id="check">Проверить</button>
  </div>
</footer>

<script src="core/design.js?v=5"></script>
<script src="core/media.js?v=4"></script>
<script src="core/mediaviewer.js?v=1"></script>
<script src="core/richtext.js?v=5"></script>
<script src="core/rough.js?v=9"></script>
<script src="modules/image-to-gaps/player.js?v=3"></script>
<script src="modules/true-false/player.js?v=3"></script>
<script src="modules/multiple-choice/player.js?v=2"></script>
<script src="modules/matching/player.js?v=3"></script>
<script>
const params = new URLSearchParams(location.search);
const id = params.get('id') || 'ex-001';
let data = null, mode = 'word_bank', gaps = [], selected = null;
// Модуль упражнения: Fill Blanks (по умолчанию) или Image to Gaps (modules/image-to-gaps/player.js). Общие — шапка, инструкция, проверки, результат
const isImg = () => !!data && data.module === 'image_to_gaps';
// True / False (modules/true-false/player.js): вместо пропусков — утверждения; каждое утверждение работает как «пропуск» общего хода
const isTF = () => !!data && data.module === 'true_false';
// Модули, где единицы ответа — вопросы, а не пропуски (True / False, Multiple Choice): плеер модуля даёт units, reset, goMissing, instant, render
const unitPlayer = () => (!data ? null : data.module === 'true_false' ? TrueFalsePlayer : data.module === 'multiple_choice' ? MultipleChoicePlayer : data.module === 'matching' ? MatchingPlayer : null);
// Прохождение: сколько проверок разрешено и потрачено, закончено ли, сообщение под кнопкой
let maxChecks = 3, checksUsed = 0, finished = false, note = '', instrOpen = true;
// Порядок слов перемешивается один раз на прохождение. В банке — экземпляры {key, text}, selected хранит key
let bankOrder = [], poolOrder = [];

// Сравнение: Unicode NFC, без учёта регистра, лишних пробелов и точки, запятой, ? и ! в конце
const norm = s => String(s).normalize('NFC').trim().replace(/\s+/g, ' ').replace(/[.,?!]+$/, '').trim().toLowerCase();
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const $ = id => document.getElementById(id);

// Без повторов: одинаковыми считаются слова, равные после нормализации
const uniq = words => {
  const seen = new Set();
  return words.filter(w => { const k = norm(w); if (!k || seen.has(k)) return false; seen.add(k); return true; });
};

// Стиль упражнения (Classic или Comic) и цвет контуров Comic берутся из файла (design.style, design.comicLine).
// Для пробы значения можно переопределить в ссылке, но только с признаком probe=1 (иначе ученик мог бы менять вид, дописав адрес):
// ?probe=1&style=comic&line=black&lw=thin|thick&shape=pill&dashed=1&num=1&width=wide
function applyLook() {
  const q = k => (params.has('probe') ? params.get(k) : null);
  const dz = data.design = { ...(data.design || {}) };
  if (q('shape') || q('dashed') || q('num') || q('width')) {
    dz.gap = { ...(dz.gap || {}), ...(q('shape') ? { shape: q('shape') } : {}), ...(q('dashed') ? { dashed: q('dashed') === '1' } : {}), ...(q('num') ? { numbered: q('num') === '1' } : {}), ...(q('width') ? { width: q('width') } : {}) };
  }
  // Макет: ширина колонки, плотность, фон (core/design.js); «Карточка» — рамка вокруг всего упражнения
  const page = normalizePage(dz.page);
  document.documentElement.classList.remove(...PAGE_CLASSES, ...CHECK_CLASSES);
  document.documentElement.classList.add(...pageClasses(page), ...checkClasses(normalizeCheck(dz.check)));
  $('root').classList.toggle('panel', page.background === 'card');
  document.documentElement.classList.toggle('style-comic', (q('style') || dz.style) === 'comic');
  document.documentElement.classList.toggle('line-black', (q('line') || dz.comicLine) === 'black');
  // Толщина линии Comic: тонкая, обычная (по умолчанию), толстая
  document.documentElement.classList.toggle('lw-thin', (q('lw') || dz.comicWidth) === 'thin');
  document.documentElement.classList.toggle('lw-thick', (q('lw') || dz.comicWidth) === 'thick');
}

// Формат 2: текст предложения — куски строк и пропуски {gap: ID}, данные пропусков лежат в data.gaps
function build() {
  gaps = [];
  if (unitPlayer()) gaps = unitPlayer().units();
  else data.items.forEach(item => {
    item.parts.forEach(p => {
      if (typeof p === 'string') return;
      const g = data.gaps[p.gap];
      gaps.push(isImg() ? ImageToGapsPlayer.gap(p.gap, g) : { id: p.gap, answer: g.answer, alternatives: g.alternatives || [], hint: String(g.hint || '').trim(), audio: mediaSrc(g.audio), hintAudio: mediaSrc(g.hintAudio), value: '', bankKey: null, locked: false, state: null });
    });
  });
  mode = data.mode || 'word_bank';
  // Image to Gaps: свой способ ответа (банк картинок), кнопок режимов нет
  document.body.classList.toggle('no-modes', isImg() || !!unitPlayer());
  if (unitPlayer()) unitPlayer().reset();
  applyLook();
  // Цвет упражнения; если файл с набором цветов не загрузился, остаётся стандартный фиолетовый
  if (typeof applyAccent === 'function') applyAccent(document.documentElement, data.design && data.design.accent);
  // Число проверок: выбрал преподаватель (1–5), иначе 3 при 1–5 пропусках и 5 при 6 и больше
  const set = Number(data.behavior && data.behavior.checks);
  maxChecks = set >= 1 && set <= 5 ? Math.floor(set) : (gaps.length <= 5 ? 3 : 5);
  if (unitPlayer() && unitPlayer().maxChecks && unitPlayer().maxChecks()) maxChecks = unitPlayer().maxChecks(); // модуль задаёт число проверок сам (Matching Lines: одна)
  checksUsed = 0; finished = false; note = ''; selected = null; instrOpen = true;
  shuffleWords();
}

// Банк: у каждого ответа свой экземпляр (два пропуска с ответом «the» — два слова в банке) и ловушки.
// Выпадающий список: ответы, альтернативы и ловушки без повторов (общий пул)
function shuffleWords() {
  if (unitPlayer()) { bankOrder = []; poolOrder = []; return; }
  if (isImg()) { bankOrder = ImageToGapsPlayer.shuffle(); return; }
  const answers = gaps.map(g => g.answer);
  const distractors = data.distractors || [];
  const taken = new Set(answers.map(norm));
  const traps = uniq(distractors).filter(w => !taken.has(norm(w)));
  bankOrder = shuffle([...answers, ...traps].map((text, key) => ({ key, text })));
  poolOrder = shuffle(uniq([...answers, ...gaps.flatMap(g => g.alternatives), ...distractors]));
}

// Закреплённые после проверки ответы и всё после конца прохождения менять нельзя
const frozen = g => g.locked || g.final || finished; // final: ответ дан с единственной попыткой (True / False «по одному»)
const isFilled = g => g.locked || norm(g.value) !== '';

// Подсказки: значок есть только у пропусков с подсказкой, на которые ещё нет верного ответа.
// До второй проверки он закрыт (замок), потом открывается; баллы и проверки подсказка не трогает
const HINTS_AFTER = 2;
let pop = null, popOwner = null;

function closePop() {
  if (pop) pop.remove();
  pop = popOwner = null;
}

// Звук: один на всю страницу. Нажатие на играющую кнопку останавливает звук, на другую — переключает
let audioEl = null, audioBtn = null, audioKey = '';
function stopAudio() {
  if (audioEl) { audioEl.onended = audioEl.onerror = null; audioEl.pause(); }
  audioEl = null;
  if (audioBtn) { audioBtn.classList.remove('playing'); audioBtn.textContent = audioBtn.dataset.icon + (audioBtn.dataset.text ? ' ' + audioBtn.dataset.text : ''); }
  audioBtn = null; audioKey = '';
}
function playAudio(url, btn, key) {
  if (audioBtn === btn) return stopAudio();
  stopAudio();
  audioEl = new Audio(url);
  audioBtn = btn; audioKey = key;
  btn.classList.add('playing');
  btn.textContent = '⏹' + (btn.dataset.text ? ' ' + btn.dataset.text : '');
  audioEl.onended = audioEl.onerror = stopAudio;
  audioEl.play().catch(stopAudio);
}
// Кнопка звука: icon — значок в покое, key — по нему кнопка находится заново, если страницу перерисовали во время звучания
function audioButton(url, key, cls, icon, label, text) {
  const b = document.createElement('button');
  b.className = cls;
  b.dataset.icon = icon; b.dataset.akey = key;
  if (text) b.dataset.text = text; // подпись рядом со значком
  const suffix = text ? ' ' + text : '';
  const on = audioKey === key && audioEl;
  b.textContent = (on ? '⏹' : icon) + suffix;
  if (on) { b.classList.add('playing'); audioBtn = b; }
  b.setAttribute('aria-label', label);
  b.onclick = e => { e.stopPropagation(); playAudio(url, b, key); };
  return b;
}

function showPop(btn, text, audio) {
  closePop();
  pop = document.createElement('div');
  pop.className = 'pop';
  pop.setAttribute('role', 'tooltip');
  pop.textContent = text;
  if (audio) pop.append(audioButton(audio.url, audio.key, 'audbtn', '🔊', 'Прослушать подсказку', 'Слушать'));
  popOwner = btn;
  document.body.appendChild(pop);
  // Ставим под значком по центру, но не за краем окна; если снизу нет места — над значком
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8)) + 'px';
  const below = r.bottom + 6;
  pop.style.top = (below + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : below) + 'px';
}

function hintButton(idx) {
  const g = gaps[idx];
  if ((!g.hint && !g.hintAudio) || g.locked) return null;
  const open = checksUsed >= HINTS_AFTER;
  const btn = document.createElement('button');
  btn.className = 'hintbtn' + (open ? '' : ' locked');
  btn.textContent = open ? '💡' : '🔒';
  const text = open ? g.hint : 'Подсказка откроется после второй проверки.';
  const audio = open && g.hintAudio ? { url: g.hintAudio, key: 'h' + idx } : null;
  btn.setAttribute('aria-label', open ? 'Показать подсказку' : text);
  btn.onclick = e => {
    e.stopPropagation();
    if (popOwner === btn) closePop(); else showPop(btn, text, audio);
  };
  return btn;
}

// Озвучка слова: значок динамика в правом верхнем углу пропуска, только у озвученных. Не зависит от проверок
function voiceButton(idx) {
  const g = gaps[idx];
  if (!g.audio) return null;
  return audioButton(g.audio, 'v' + idx, 'hintbtn voicebtn', '🔊', 'Прослушать слово');
}

addEventListener('click', closePop);
addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
addEventListener('resize', closePop);
$('main').addEventListener('scroll', closePop);

// Инструкция показывается, если в ней что-то написано и преподаватель не скрыл её; «Начать заново» разворачивает её снова
// Текст и изображение скрываются независимо; изображение без текста показывается без заголовка и сворачивания
function instructionBlock() {
  const ins = data.instruction || {}, design = data.design || {};
  const title = String(ins.title || '').trim(), text = String(ins.text || '').trim();
  const showText = (title || text || mediaSrc(ins.audio)) && design.showInstruction !== false; // звук один, без текста, тоже показывается
  const image = design.showImage === false ? null : instructionImageEl(ins.image);
  if (!showText && !image) return null;
  const box = document.createElement('section');
  box.className = 'instr';
  if (!showText) {
    const only = document.createElement('div');
    only.className = 'instr-body';
    only.appendChild(image);
    box.appendChild(only);
    return box;
  }
  const head = document.createElement('button');
  head.className = 'instr-head';
  head.textContent = title || 'Инструкция';
  head.setAttribute('aria-expanded', String(instrOpen));
  head.onclick = () => {
    instrOpen = !instrOpen;
    head.setAttribute('aria-expanded', String(instrOpen));
    body.hidden = !instrOpen;
  };
  const body = document.createElement('div');
  body.className = 'instr-body';
  body.hidden = !instrOpen;
  if (image) body.appendChild(image);
  const audio = mediaSrc(ins.audio);
  if (audio) {
    const p = document.createElement('p');
    p.appendChild(audioButton(audio, 'instr', 'audbtn', '🔊', 'Прослушать инструкцию', 'Слушать'));
    body.appendChild(p);
  }
  body.appendChild(richText(text));
  box.append(head, body);
  return box;
}

function render() {
  closePop();
  const main = $('main');
  const scroll = main.scrollTop;
  $('title').textContent = data.title;
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  const root = $('root');
  root.innerHTML = '';
  const instr = instructionBlock();
  if (instr) root.appendChild(instr);
  if (unitPlayer()) {
    unitPlayer().render(root);
    renderBank();
    updateStatus();
    if (window.roughen) roughen();
    main.scrollTop = scroll;
    return;
  }
  let gi = 0;
  // Отдельные предложения: у каждого своя карточка. Связный текст: одна карточка, предложения-абзацы внутри
  const isText = data.layout === 'text';
  let textCard = null;
  data.items.forEach(item => {
    let box;
    if (isText) {
      if (!textCard) { textCard = document.createElement('div'); textCard.className = 'card'; root.appendChild(textCard); }
      box = document.createElement('div');
      box.className = 'para';
      textCard.appendChild(box);
    } else {
      box = document.createElement('div');
      box.className = 'card';
      root.appendChild(box);
    }
    // Озвучка предложения (абзаца) целиком: значок динамика в начале строки, у озвученных
    const sentenceAudio = mediaSrc(item.audio);
    if (sentenceAudio) box.appendChild(audioButton(sentenceAudio, 's' + item.id, 'hintbtn sentbtn', '🔊', 'Прослушать предложение'));
    item.parts.forEach(p => {
      if (typeof p === 'string') { box.appendChild(document.createTextNode(p)); return; }
      const idx = gi++;
      const gapEl = makeGap(idx);
      // Значок подсказки сидит на углу самого пропуска и двигается вместе с ним
      const hint = hintButton(idx), voice = voiceButton(idx);
      if (hint) gapEl.appendChild(hint);
      if (voice) gapEl.appendChild(voice);
      box.appendChild(gapEl);
    });
  });
  if (isImg()) ImageToGapsPlayer.extras(root); // Image to Gaps: переключатель верных картинок после завершения
  renderBank();
  updateStatus();
  document.querySelectorAll('.gap input').forEach(i => fitInput(i.parentElement, i)); // поля ввода под уже набранный текст
  if (window.roughen) roughen(); // Comic: нарисовать контуры заново для новых элементов
  main.scrollTop = scroll;
}

// Правка ответа снимает старую отметку «неверно» и «не заполнено»: верность узнаем только при следующей проверке
function edited(g, el) {
  g.state = null;
  el.classList.remove('bad', 'missing');
  note = '';
  updateStatus();
}

// Пропуск в режиме ввода растёт вместе с текстом (и сжимается при стирании), но не меньше ширины из дизайна и не шире строки.
// Ширину по умолчанию читаем из стилей, поэтому «Узкая», «Авто» и «Широкая» работают как начальный размер.
let measureCtx = null;
function fitInput(el, input) {
  if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
  const cs = getComputedStyle(input);
  measureCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  el.style.minWidth = '';
  const base = parseFloat(getComputedStyle(el).minWidth) || 0;
  const need = Math.ceil(measureCtx.measureText(input.value).width) + 40; // запас на поля пропуска, каретку и значки
  // Не шире строки: min-width сильнее max-width, поэтому предел считаем здесь; совсем длинный ответ прокручивается внутри поля
  const p = el.parentElement, pcs = p ? getComputedStyle(p) : null;
  const room = Math.max(base, p ? p.clientWidth - parseFloat(pcs.paddingLeft) - parseFloat(pcs.paddingRight) - 12 : need); // 12 = поля пропуска по бокам
  el.style.minWidth = Math.max(base, Math.min(need, room)) + 'px';
}

function makeGap(idx) {
  if (isImg()) return ImageToGapsPlayer.makeGap(idx);
  const g = gaps[idx];
  const el = document.createElement('span');
  // Форма, ширина и нумерация выбраны преподавателем во вкладке «Дизайн» (если файла с набором нет — сплошная линия)
  const look = typeof normalizeGapDesign === 'function' ? normalizeGapDesign(data.design && data.design.gap) : { shape: 'line', width: 'auto', dashed: false, numbered: false };
  el.className = 'gap ' + (typeof gapClasses === 'function' ? gapClasses(look) : 'shape-line w-auto') + (g.state ? ' ' + g.state : '') + (frozen(g) ? ' locked' : '');
  el.dataset.idx = idx;
  if (mode === 'typing') {
    const input = document.createElement('input');
    input.value = g.value;
    input.placeholder = '…';
    input.readOnly = frozen(g);
    input.oninput = () => { g.value = input.value; g.bankKey = null; fitInput(el, input); edited(g, el); };
    // Ждём, пока откроется клавиатура, и сдвигаем пропуск в середину
    input.onfocus = () => setTimeout(() => el.scrollIntoView({ block: 'center', behavior: 'smooth' }), 300);
    el.appendChild(input);
  } else if (mode === 'dropdown') {
    const sel = document.createElement('select');
    sel.disabled = frozen(g);
    sel.appendChild(document.createElement('option'));
    poolOrder.forEach(w => {
      const opt = document.createElement('option');
      opt.textContent = w;
      sel.appendChild(opt);
    });
    sel.value = g.value;
    sel.onchange = () => { g.value = sel.value; g.bankKey = null; edited(g, el); };
    el.appendChild(sel);
  } else {
    el.textContent = g.value;
    el.onclick = () => {
      if (frozen(g)) return;
      if (selected !== null) {
        // Выбранное слово встаёт в пропуск; прежнее слово из этого пропуска возвращается в банк
        const w = bankOrder.find(b => b.key === selected);
        g.value = w.text;
        g.bankKey = w.key;
        selected = null;
      } else if (g.value) {
        g.value = '';
        g.bankKey = null;
      } else return;
      g.state = null;
      note = '';
      render();
    };
  }
  // Номер на углу пропуска; добавляется последним, потому что в режиме банка текст пропуска заменяет всё его содержимое
  if (look.numbered) {
    const num = document.createElement('span');
    num.className = 'gap-num';
    num.setAttribute('aria-hidden', 'true');
    num.textContent = idx + 1;
    el.appendChild(num);
  }
  return el;
}

function renderBank() {
  const bank = $('bank');
  const scroll = bank.scrollTop;
  bank.innerHTML = '';
  if (isImg()) { ImageToGapsPlayer.renderBank(bank); bank.scrollTop = scroll; return; }
  if (mode !== 'word_bank') return;
  const used = new Set(gaps.map(g => g.bankKey).filter(k => k !== null));
  bankOrder.forEach(w => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (used.has(w.key) ? ' used' : '') + (selected === w.key ? ' selected' : '');
    chip.textContent = w.text;
    if (!used.has(w.key) && !finished) chip.onclick = () => { selected = selected === w.key ? null : w.key; render(); };
    bank.appendChild(chip);
  });
  bank.scrollTop = scroll;
}

// Строка внизу: до первой проверки — сколько заполнено, потом результат и остаток проверок, в конце — итог
function updateStatus() {
  const total = gaps.length, ok = gaps.filter(g => g.locked).length;
  const s = $('score'), t = $('scoreText'), pct = total ? Math.round(ok / total * 100) : 0;
  const wrong = gaps.filter(g => g.state === 'bad').length;
  s.classList.toggle('warn', !!note);
  // До первой проверки результата нет (только сколько заполнено); после проверки появляется рамка; в конце — итог и полоса с процентом
  s.classList.toggle('result', checksUsed > 0 || !!note);
  s.classList.toggle('final', finished && !note);
  const once = !!unitPlayer() && unitPlayer().instant(); // «по одному»: без кнопки «Проверить», каждый ответ засчитывается сразу
  if (note) t.textContent = note;
  else if (once && !finished) t.textContent = `Отвечено: ${gaps.filter(g => g.final).length} из ${total} · Верно: ${ok}`;
  else if (finished) t.textContent = `Результат: ${ok} из ${total} (${pct}%)`;
  else if (checksUsed === 0) t.textContent = `Заполнено: ${gaps.filter(isFilled).length} из ${total}`;
  else t.textContent = `Верно: ${ok} из ${total} · Неверно: ${wrong} · Проверок осталось: ${maxChecks - checksUsed}`;
  const showBar = finished && !note;
  $('scoreBar').hidden = !showBar;
  $('scoreBar').firstElementChild.style.width = pct + '%';
  if (window.roughen) roughen(s.parentElement); // Comic: рамка блока результата появляется и меняет размер
  // Подпись меняем только если она правда изменилась: перезапись текста стирает нарисованный контур кнопки (Comic)
  $('check').hidden = once && !finished;
  const label = finished ? 'Начать заново' : 'Проверить';
  if ($('check').textContent !== label) { $('check').textContent = label; if (window.roughen) roughen($('check').parentElement); }
}

function check() {
  if (finished) return;
  // Неполный ответ проверку не тратит: показываем, чего не хватает
  const missing = gaps.filter(g => !isFilled(g));
  if (missing.length) {
    gaps.forEach(g => { if (!g.locked) g.state = isFilled(g) ? null : 'missing'; });
    if (unitPlayer()) {
      note = unitPlayer().missingNote(missing.length);
      unitPlayer().goMissing();
    } else note = missing.length === 1 ? 'Заполните пропуск, который остался пустым.' : `Заполните все пропуски: ещё ${missing.length}.`;
    render();
    const first = document.querySelector('.gap.missing, .tf-card.missing, .mc-card.missing, .mt-card.missing');
    if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
    return;
  }
  checksUsed++;
  note = '';
  gaps.forEach(g => {
    if (g.locked) return;
    // Засчитываются основной ответ и альтернативы именно этого пропуска
    const right = [g.answer, ...g.alternatives].some(a => norm(a) === norm(g.value));
    g.state = right ? 'ok' : 'bad';
    g.locked = right;
  });
  if (gaps.every(g => g.locked) || checksUsed >= maxChecks) finished = true;
  render();
}

// Новое прохождение: ответы, закрепление, проверки и сообщения сбрасываются, слова перемешиваются заново
function restart() {
  gaps.forEach(g => { g.value = ''; g.bankKey = null; g.locked = false; g.final = false; g.state = null; });
  checksUsed = 0; finished = false; note = ''; selected = null; instrOpen = true;
  if (unitPlayer()) unitPlayer().reset();
  shuffleWords();
  closeResetAsk();
  render();
  $('main').scrollTop = 0;
}

const started = () => checksUsed > 0 || gaps.some(g => g.value);
function closeResetAsk() { $('resetAsk').hidden = true; $('resetTop').hidden = false; }

$('resetTop').onclick = () => {
  if (!data) return;
  if (!started()) { restart(); return; }
  // Ответы уже есть: коротко спрашиваем, чтобы не сбросить случайно
  $('resetTop').hidden = true;
  $('resetAsk').hidden = false;
};
$('resetYes').onclick = restart;
$('resetNo').onclick = closeResetAsk;
$('check').onclick = () => { if (finished) restart(); else check(); };
// В предпросмотре другой режим означает новое прохождение
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => { mode = b.dataset.mode; restart(); });

// Снято с публикации или не найдено: ученик видит только сообщение, без кнопок
function showUnavailable() {
  document.body.innerHTML = '<div class="unavailable">Упражнение сейчас недоступно</div>';
}

// Шрифт Comic (Bubble Sans) грузится после первой отрисовки и шире обычного: заново подгоняем поля ввода и контуры
function afterFontsLoaded() {
  document.querySelectorAll('.gap input').forEach(i => fitInput(i.parentElement, i));
  if (window.roughen) roughen();
}
if (document.fonts) {
  document.fonts.addEventListener('loadingdone', afterFontsLoaded);
  if (document.fonts.ready) document.fonts.ready.then(afterFontsLoaded);
}

if (params.has('preview')) {
  document.body.classList.add('preview');
  // Предпросмотр в редакторе: данные черновика присылает страница редактора с того же сайта, файл не загружается
  const setTheme = t => {
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    else delete document.documentElement.dataset.theme;
  };
  addEventListener('message', e => {
    if (e.origin !== location.origin || e.source !== parent || !e.data) return;
    if (e.data.type === 'dimvibe-theme') { setTheme(e.data.theme); return; }
    if (e.data.type !== 'dimvibe-preview') return;
    setTheme(e.data.theme);
    data = e.data.exercise; build(); render();
  });
  parent.postMessage({ type: 'dimvibe-preview-ready' }, location.origin);
} else {
  fetch(`${id}.json`, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(d => {
      if (d.published === false) { showUnavailable(); return; }
      data = d; build(); render();
    })
    .catch(showUnavailable);
}
</script>
</body>
