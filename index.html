<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DimVibe — тест Fill Blanks</title>
<style>
  :root { --bg:#f7f7fb; --card:#fff; --text:#1d1d2b; --muted:#6b6b80; --accent:#6d4aff; --ok:#1f9d55; --bad:#d64545; --line:#c9c9d8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16161f; --card:#20202c; --text:#f2f2f8; --muted:#a3a3b5; --accent:#9d86ff; --ok:#4ccf82; --bad:#ff7070; --line:#41415a; }
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  /* Три части: шапка и низ на месте, прокручивается только середина */
  body { margin:0; display:flex; flex-direction:column; height:100vh; height:100dvh; background:var(--bg); color:var(--text); font-family: system-ui, "Noto Sans", "Noto Sans Georgian", "Segoe UI", sans-serif; line-height:1.5; }
  header { flex:none; padding:10px 12px 8px; border-bottom:1px solid var(--line); }
  main { flex:1 1 auto; min-height:0; overflow-y:auto; padding:10px 12px; -webkit-overflow-scrolling:touch; }
  footer { flex:none; padding:8px 12px 10px; border-top:1px solid var(--line); background:var(--bg); }
  h1 { font-size:1.05rem; margin:0 0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .modes { display:flex; gap:6px; overflow-x:auto; }
  .modes button { flex:none; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:6px 12px; min-height:40px; cursor:pointer; }
  .modes button { font-size:.9rem; min-height:36px; padding:4px 10px; }
  button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px; line-height:2.4; }
  .gap { display:inline-flex; align-items:center; justify-content:center; min-width:90px; min-height:40px; border-bottom:2px solid var(--accent); margin:0 4px; padding:0 6px; vertical-align:middle; text-align:center; cursor:pointer; line-height:1.3; }
  .gap.ok { color:var(--ok); border-color:var(--ok); }
  .gap.bad { color:var(--bad); border-color:var(--bad); }
  .gap input, .gap select { font:inherit; width:100%; min-height:38px; border:none; background:transparent; color:var(--text); text-align:center; }
  .gap select option { background:var(--card); color:var(--text); }
  /* Банк занимает не больше четверти экрана и прокручивается сам */
  .bank { display:flex; flex-wrap:wrap; gap:6px; max-height:25vh; overflow-y:auto; margin-bottom:8px; }
  .bank:empty { display:none; }
  .chip { display:inline-flex; align-items:center; min-height:36px; padding:2px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); cursor:pointer; user-select:none; }
  .chip.used { opacity:.35; cursor:default; }
  .chip.selected { background:var(--accent); color:#fff; border-color:var(--accent); }
  .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .score { color:var(--muted); }
  .unavailable { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; color:var(--muted); font-size:1.1rem; }
</style>
</head>
<body>
<header>
  <h1 id="title">Загрузка…</h1>
  <div class="modes">
    <button data-mode="word_bank">Банк слов</button>
    <button data-mode="dropdown">Выпадающий список</button>
    <button data-mode="typing">Ввод вручную</button>
  </div>
</header>
<main id="main">
  <div id="root"></div>
</main>
<footer>
  <div class="bank" id="bank"></div>
  <div class="actions">
    <button class="primary" id="check">Проверить</button>
    <button id="reset">Начать заново</button>
    <span class="score" id="score"></span>
  </div>
</footer>

<script>
const params = new URLSearchParams(location.search);
const id = params.get('id') || 'ex-001';
let data = null, mode = 'word_bank', gaps = [], selected = null, checked = false;
// Порядок слов перемешивается один раз на прохождение. В банке — экземпляры {key, text}, selected хранит key
let bankOrder = [], poolOrder = [];

const norm = s => String(s).trim().replace(/\s+/g, ' ').toLowerCase();
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);

// Без повторов: одинаковыми считаются слова, равные после нормализации
const uniq = words => {
  const seen = new Set();
  return words.filter(w => { const k = norm(w); if (!k || seen.has(k)) return false; seen.add(k); return true; });
};

// Формат 2: текст предложения — куски строк и пропуски {gap: ID}, данные пропусков лежат в data.gaps
function build() {
  gaps = [];
  data.items.forEach(item => {
    item.parts.forEach(p => {
      if (typeof p === 'string') return;
      const g = data.gaps[p.gap];
      gaps.push({ id: p.gap, answer: g.answer, alternatives: g.alternatives || [], value: '', bankKey: null });
    });
  });
  mode = data.mode || 'word_bank';
  shuffleWords();
}

// Банк: у каждого ответа свой экземпляр (два пропуска с ответом «the» — два слова в банке) и ловушки.
// Выпадающий список: ответы, альтернативы и ловушки без повторов (общий пул)
function shuffleWords() {
  const answers = gaps.map(g => g.answer);
  const distractors = data.distractors || [];
  const taken = new Set(answers.map(norm));
  const traps = uniq(distractors).filter(w => !taken.has(norm(w)));
  bankOrder = shuffle([...answers, ...traps].map((text, key) => ({ key, text })));
  poolOrder = shuffle(uniq([...answers, ...gaps.flatMap(g => g.alternatives), ...distractors]));
}

function render() {
  checked = false;
  const main = document.getElementById('main');
  const scroll = main.scrollTop;
  document.getElementById('title').textContent = data.title;
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  const root = document.getElementById('root');
  root.innerHTML = '';
  let gi = 0;
  data.items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    item.parts.forEach(p => {
      if (typeof p === 'string') { card.appendChild(document.createTextNode(p)); return; }
      card.appendChild(makeGap(gi++));
    });
    root.appendChild(card);
  });
  renderBank();
  document.getElementById('score').textContent = '';
  main.scrollTop = scroll;
}

function makeGap(idx) {
  const g = gaps[idx];
  const el = document.createElement('span');
  el.className = 'gap';
  el.dataset.idx = idx;
  if (mode === 'typing') {
    const input = document.createElement('input');
    input.value = g.value;
    input.placeholder = '…';
    input.oninput = () => { g.value = input.value; g.bankKey = null; };
    // Ждём, пока откроется клавиатура, и сдвигаем пропуск в середину
    input.onfocus = () => setTimeout(() => el.scrollIntoView({ block: 'center', behavior: 'smooth' }), 300);
    el.appendChild(input);
  } else if (mode === 'dropdown') {
    const sel = document.createElement('select');
    sel.appendChild(document.createElement('option'));
    poolOrder.forEach(w => {
      const opt = document.createElement('option');
      opt.textContent = w;
      sel.appendChild(opt);
    });
    sel.value = g.value;
    sel.onchange = () => { g.value = sel.value; g.bankKey = null; };
    el.appendChild(sel);
  } else {
    el.textContent = g.value;
    el.onclick = () => {
      if (g.value) { g.value = ''; g.bankKey = null; }
      else if (selected !== null) {
        const w = bankOrder.find(b => b.key === selected);
        g.value = w.text;
        g.bankKey = w.key;
        selected = null;
      }
      render();
    };
  }
  return el;
}

function renderBank() {
  const bank = document.getElementById('bank');
  const scroll = bank.scrollTop;
  bank.innerHTML = '';
  if (mode !== 'word_bank') return;
  const used = new Set(gaps.map(g => g.bankKey).filter(k => k !== null));
  bankOrder.forEach(w => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (used.has(w.key) ? ' used' : '') + (selected === w.key ? ' selected' : '');
    chip.textContent = w.text;
    if (!used.has(w.key)) chip.onclick = () => { selected = selected === w.key ? null : w.key; render(); };
    bank.appendChild(chip);
  });
  bank.scrollTop = scroll;
}

function check() {
  checked = true;
  let ok = 0;
  document.querySelectorAll('.gap').forEach(el => {
    const g = gaps[el.dataset.idx];
    // Засчитываются основной ответ и альтернативы именно этого пропуска
    const right = [g.answer, ...g.alternatives].some(a => norm(a) === norm(g.value));
    if (right) ok++;
    el.classList.remove('ok', 'bad');
    el.classList.add(right ? 'ok' : 'bad');
  });
  document.getElementById('score').textContent = `Верно: ${ok} из ${gaps.length}`;
}

document.querySelectorAll('.modes button').forEach(b => b.onclick = () => { mode = b.dataset.mode; selected = null; render(); });
document.getElementById('check').onclick = check;
document.getElementById('reset').onclick = () => {
  gaps.forEach(g => { g.value = ''; g.bankKey = null; });
  selected = null;
  shuffleWords();
  render();
  document.getElementById('main').scrollTop = 0;
};

// Снято с публикации или не найдено: ученик видит только сообщение, без кнопок
function showUnavailable() {
  document.body.innerHTML = '<div class="unavailable">Упражнение сейчас недоступно</div>';
}

if (params.has('preview')) {
  // Предпросмотр в редакторе: данные черновика присылает страница редактора с того же сайта, файл не загружается
  addEventListener('message', e => {
    if (e.origin !== location.origin || e.source !== parent || !e.data || e.data.type !== 'dimvibe-preview') return;
    data = e.data.exercise; build(); render();
  });
  parent.postMessage({ type: 'dimvibe-preview-ready' }, location.origin);
} else {
  fetch(`${id}.json`, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(d => {
      if (d.published === false) { showUnavailable(); return; }
      data = d; build(); render();
    })
    .catch(showUnavailable);
}
</script>
</body>
</html>
